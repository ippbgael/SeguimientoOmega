<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Seguimiento OMEGA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Barra lateral fija + área de trabajo; en móvil, navegación inferior. Solo modo claro. */
:root{
  --bg:#F0ECE3; --surface:#F8F5EE; --sunken:#EAE5D9; --line:#E2DCCF;
  --text:#2A2721; --muted:#756D5E; --muted3:#9A9280;
  --accent:#1E6FE3; --accent-soft:#E1EAF8; --on-accent:#FFFFFF; --navy:#2B3D5B;
  --danger:#B23A2E; --danger-bg:#F6DED8; --late:#9A5A10; --late-bg:#F9E8CF;
  --pos:#1E6E52;
  --e0-bg:#EAE5D9; --e0-fg:#5E574A; --e0-bar:#C9C1AF;
  --e1-bg:#F7E9D2; --e1-fg:#7A4F0E; --e1-bar:#D9A04E;
  --e2-bg:#DDE8F7; --e2-fg:#1F4E9C; --e2-bar:#4F86D9;
  --e3-bg:#FBE1D3; --e3-fg:#A4431B; --e3-bar:#E07B4C;
  --e4-bg:#DCF2E7; --e4-fg:#1E6E52; --e4-bar:#2E9E77;
  --prog:#8C836F; --c-ali:#E07B4C; --c-ieq:#2B3D5B; --c-irv:#4F86D9;
  --sh:7px 7px 16px rgba(140,128,100,.20),-6px -6px 14px rgba(255,255,255,.85);
  --sh-sm:4px 4px 10px rgba(140,128,100,.18),-3px -3px 8px rgba(255,255,255,.8);
  --sh-in:inset 3px 3px 7px rgba(140,128,100,.18),inset -3px -3px 6px rgba(255,255,255,.75);
  --overlay:rgba(42,39,33,.32);
  --f-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --f-body:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --r:20px; --r-sm:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--pos);font-weight:600}.neg{color:var(--danger);font-weight:600}

.layout{display:flex;min-height:100%}
.side{width:240px;flex-shrink:0;background:var(--surface);box-shadow:4px 0 20px rgba(0,0,0,.06);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px 14px}
.brand{padding:0 8px 22px}
.logo{display:block;height:30px;width:auto}
.brand b{display:block;font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.15;margin-top:14px}
.brand span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted3);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:var(--r-sm);padding:10px 12px;text-align:left;font-weight:600;font-size:13.5px;color:var(--text)}
.nav button:hover{background:var(--sunken)}
.nav button[aria-current="page"]{background:var(--sunken);box-shadow:var(--sh-in)}
.nav .ic{width:24px;height:24px;border-radius:8px;background:var(--sunken);color:var(--muted);display:grid;place-items:center;font-size:12px;flex-shrink:0}
.nav button[aria-current="page"] .ic{background:var(--accent);color:var(--on-accent)}
.nav .badge{margin-left:auto;font-size:11px;background:var(--late-bg);color:var(--late);border-radius:99px;padding:1px 8px}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.av.sm{width:24px;height:24px;font-size:9.5px}
.me b{display:block;font-size:13px}.me span{font-size:11.5px;color:var(--muted)}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.top h1{font-size:22px}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.top .tgrow{flex:1;min-width:200px}
.top .mlogo{display:none;height:22px;width:auto}
.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--e1-bg);color:var(--e1-fg);border-radius:99px;padding:4px 10px}
.sel,.inp{background:var(--sunken);border:0;border-radius:var(--r-sm);padding:8px 12px;box-shadow:var(--sh-in);font-size:13px;min-width:0}
.btn{border:0;border-radius:var(--r-sm);padding:9px 16px;font-weight:600;font-size:13px;background:var(--surface);box-shadow:var(--sh-sm);color:var(--text)}
.btn:hover{box-shadow:var(--sh-in)}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:none}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--e4-bar);color:#fff;box-shadow:none}
.btn.warn{background:var(--e3-bg);color:var(--e3-fg);box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.sm{padding:6px 12px;font-size:12px}

.view{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1560px;width:100%}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;min-width:0}
.card h2{font-size:15.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);margin-left:auto}
.grid{display:grid;gap:18px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g2e{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted3)}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

.bar{height:10px;border-radius:99px;background:var(--sunken);box-shadow:var(--sh-in);overflow:hidden;flex:1;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar>b{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.75}
.stack{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:var(--sunken);flex:1}
.stack>i{display:block;height:100%}
.row{display:flex;align-items:center;gap:12px}
.rows{display:flex;flex-direction:column;gap:12px}
.lbl{font-size:13px;font-weight:600;min-width:0}
.lbl small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.clkrow{border:0;background:transparent;width:100%;text-align:left;padding:4px 6px;border-radius:10px}
.clkrow:hover{background:var(--sunken)}

/* Gráficos de barras */
.vplot{position:relative;height:210px}
.vin{position:absolute;left:38px;right:4px;top:22px;bottom:0;border-bottom:1px solid var(--muted3)}
.vg{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.vg span{position:absolute;left:-38px;top:-8px;width:32px;text-align:right;font-size:10.5px;color:var(--muted3)}
.vgrps{position:absolute;inset:0;display:flex;gap:16px;align-items:flex-end}
.vgrp{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
.vgrp.dim{opacity:.4}
.vbar{width:min(36px,42%);border-radius:4px 4px 0 0;position:relative}
.vbar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;padding-bottom:3px;white-space:nowrap;color:var(--text)}
.vlbls{display:flex;gap:16px;margin:8px 4px 0 38px}
.vlbls div{flex:1;text-align:center;font-size:12px;font-weight:600;min-width:0}
.vlbls small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.hb{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) 34px;gap:10px;align-items:center}
.hb .track{height:16px;background:var(--sunken);border-radius:4px;overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:0 4px 4px 0}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.e0{background:var(--e0-bg);color:var(--e0-fg)}.e1{background:var(--e1-bg);color:var(--e1-fg)}.e2{background:var(--e2-bg);color:var(--e2-fg)}.e3{background:var(--e3-bg);color:var(--e3-fg)}.e4{background:var(--e4-bg);color:var(--e4-fg)}
.st-b{background:var(--danger-bg);color:var(--danger)}.st-l{background:var(--late-bg);color:var(--late)}.ok{background:var(--accent-soft);color:var(--accent)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunken);border:0;text-align:left;width:100%}
.alert:hover{box-shadow:var(--sh-in)}
.alert .t{font-size:13px;font-weight:600}
.alert .m{font-size:12px;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:12px}
.feed .it{display:flex;gap:10px}
.feed .it p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--sunken);border-radius:var(--r-sm);padding:3px;box-shadow:var(--sh-in)}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--sh-sm)}
.summary{font-size:13px;background:var(--surface);border-radius:var(--r-sm);padding:10px 14px;box-shadow:var(--sh-sm)}

.tblwrap{overflow-x:auto;border-radius:var(--r);box-shadow:var(--sh);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted3);padding:12px 10px;background:var(--sunken);white-space:nowrap;position:sticky;top:0}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.clk:hover td{background:var(--sunken)}
.pname{font-weight:600;max-width:280px;border:0;background:transparent;padding:0;text-align:left}
.pname .mono{display:block;color:var(--muted3);font-weight:500;margin-top:2px}
.cells{display:flex;gap:4px}
.cell{border:0;border-radius:8px;min-width:46px;padding:5px 6px;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.cell.venc{box-shadow:inset 0 0 0 2px var(--danger)}
.cell.vrev{box-shadow:inset 0 0 0 2px var(--late)}
.cell:hover{filter:brightness(.95)}

.gantt{position:relative;min-width:980px}
.gh{display:grid;grid-template-columns:260px 1fr;font-size:11px;color:var(--muted3)}
.gscale{position:relative;height:22px}
.gscale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.grow{display:grid;grid-template-columns:260px 1fr;align-items:center;min-height:38px;border-top:1px solid var(--line)}
.grow .gl{font-size:12.5px;padding-right:12px;min-width:0}
.grow .gl b{display:block;font-size:13px}
.gtrack{position:relative;height:100%;min-height:38px}
.gbar{position:absolute;top:50%;transform:translateY(-50%);height:16px;border-radius:99px;background:var(--sunken);overflow:hidden;box-shadow:var(--sh-in)}
.gbar>i{display:block;height:100%}
.gseg{position:absolute;top:50%;transform:translateY(-50%);height:12px;border-radius:4px}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.7;z-index:1}
.gsub .gl{padding-left:22px;font-weight:500}
.caret{border:0;background:transparent;color:var(--muted);padding:0 6px 0 0;font-size:10px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.pc{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left;width:100%}
.pc h3{font-size:15px;line-height:1.3}
.todo{font-size:12px;color:var(--late);display:flex;flex-direction:column;gap:2px}

.rvcard{display:flex;flex-direction:column;gap:10px}
.rvcard .hd{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}

/* Mapa de procesos */
.mapwrap{overflow:auto;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);padding:12px;max-height:72vh}
.mapwrap svg{display:block}
.mnode{cursor:pointer}
.mnode:hover rect{fill:var(--sunken)}
.rel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:8px 10px}
.rel .relp{border:0;background:transparent;padding:0;text-align:left;font-size:13px;font-weight:600;flex:1;min-width:160px}
.rel .relp small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}

.drawer-bg{position:fixed;inset:0;background:var(--overlay);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:31;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{font-size:19px;line-height:1.25;margin-top:6px}
.dbody{flex:1;overflow-y:auto;padding:16px 22px 28px;display:flex;flex-direction:column;gap:16px}
.dbody>*{flex-shrink:0}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meta div{background:var(--sunken);border-radius:var(--r-sm);padding:9px 12px;min-width:0}
.meta small{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted3)}
.meta b{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.sect{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sect span{font-weight:500;letter-spacing:0;text-transform:none}
.sect .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.doc{border-radius:14px;background:var(--bg);overflow:hidden}
.doc>button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:11px 12px;text-align:left;flex-wrap:wrap}
.doc>button:hover{background:var(--sunken)}
.doc .dn{flex:1;min-width:170px;font-size:13px;font-weight:600}
.doc .dn small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ed{padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.ed label,.flbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted3);display:block;margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ed .inp,.fw{width:100%}
textarea.inp{resize:vertical;min-height:54px}
textarea.big{min-height:120px}
.hist{display:flex;flex-direction:column;gap:10px}
.hist .h{display:flex;gap:10px;font-size:12.5px}
.hist .h p{margin:2px 0 0;color:var(--muted);white-space:pre-line}
.note{font-size:12px;color:var(--muted);background:var(--sunken);border-radius:var(--r-sm);padding:10px 12px}
.note.warn{background:var(--e3-bg);color:var(--e3-fg)}
.note.bad{background:var(--danger-bg);color:var(--danger)}
.note.info{background:var(--e2-bg);color:var(--e2-fg)}
.ses{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:14px;padding:10px 12px}
.ses .sh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ses .sn{flex:1;min-width:150px;font-size:13px;font-weight:600}
.ses .sn small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.cks{display:flex;gap:5px;flex-wrap:wrap}
.ck{border:0;border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted)}
.ck[aria-pressed="true"]{background:var(--e4-bg);color:var(--e4-fg)}
.tog{display:flex;align-items:center;gap:10px;border:0;background:var(--sunken);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;font-weight:600;width:100%;text-align:left}
.tog i{width:34px;height:20px;border-radius:99px;background:var(--e0-bar);position:relative;flex-shrink:0}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}
.tog[aria-pressed="true"] i{background:var(--accent)}
.tog[aria-pressed="true"] i::after{left:17px}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:13px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.mnav{display:none}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}

@media (max-width:1300px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g2,.g2e{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .side{display:none}
  .top .mlogo{display:block}
  .top,.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .view{padding-bottom:110px}
  .g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:22px}
  .vgrps,.vlbls{gap:6px}
  .hb{grid-template-columns:minmax(0,120px) minmax(0,1fr) 28px}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .mnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted);padding:6px 2px;min-width:0}
  .mnav button[aria-current="page"]{color:var(--accent)}
  .mnav .ic{font-size:15px}
  .meta,.two,.three{grid-template-columns:1fr}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>

<script>
/* Sin datos: todo se lee desde SharePoint (ver conexion.js). */
</script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>
<script src="conexion.js"></script>
<script>
(function(){
'use strict';
/* ---------- Logo IPPB (vector) ---------- */
const LOGO=c=>`<svg class="${c}" viewBox="0 0 374 112" role="img" aria-label="IPPB"><path d="M14 2 24 12 14 22 4 12Z" fill="#1E6FE3"/><rect x="6" y="34" width="16" height="76" rx="2" fill="#2B3D5B"/><g fill="none" stroke-width="16" stroke-linejoin="round"><path d="M56 110V56M48 42H142V78H64" stroke="#1E6FE3"/><path d="M166 110V56M158 42H252V78H174" stroke="#2B3D5B"/><path d="M350 42H284V102H366V70H292" stroke="#2B3D5B"/></g></svg>`;

/* ---------- Catálogos ---------- */
const FASES=['AS IS','TO BE y BPMN','Documentación funcional','Validación y cierre'];
const FCORTA=['AS IS','TO BE','Funcional','Validación'];
const ENTS=[
  {k:'ficha',f:0,l:'Ficha AS IS',s:'Ficha'},
  {k:'mhal',f:0,l:'Matriz de hallazgos',s:'Hallaz.'},
  {k:'bpmn',f:1,l:'Diagrama BPMN (Signavio .bpmn + HTML)',s:'BPMN'},
  {k:'desc',f:1,l:'Documento de procedimientos TO BE',s:'Proced.'},
  {k:'mcon',f:2,l:'Matriz de consideraciones',s:'Consid.'},
  {k:'mreq',f:2,l:'Matriz de requerimientos',s:'Requer.'},
  {k:'aval',f:3,l:'Acta de validación funcional',s:'Acta VF'}];
const ENT=Object.fromEntries(ENTS.map(t=>[t.k,t]));
// Estados del entregable (RF-02). El % por estado es una regla propuesta, por confirmar con Jenny.
const ST=[{l:'Sin iniciar',c:'e0',p:0},{l:'En elaboración',c:'e1',p:40},{l:'En revisión',c:'e2',p:85},{l:'Observado',c:'e3',p:70},{l:'Finalizado',c:'e4',p:100}];
// Motivos de desvío y de quién depende cada uno por defecto (se puede cambiar al registrarlo).
const MOTIVOS=[
  {m:'Falta BAE',d:'Alicorp'},
  {m:'Falta de usuarios clave / otro rol',d:'Alicorp'},
  {m:'Falta de acceso a herramientas',d:'Alicorp'},
  {m:'Reprogramación de calendario',d:'Alicorp'},
  {m:'Ajuste por validación',d:'IPPB'},
  {m:'Otro',d:'IPPB'}];
const MDEP=Object.fromEntries(MOTIVOS.map(x=>[x.m,x.d]));
const DEPS=['Alicorp','IPPB'];
// Responsable de un proceso atrasado.
const CAUSAS={alicorp:{l:'Alicorp',c:'var(--c-ali)'},ippb_eq:{l:'IPPB · consultores',c:'var(--c-ieq)'},ippb_rev:{l:'IPPB · revisión',c:'var(--c-irv)'},sin:{l:'Sin justificar',c:'var(--danger)'}};
const SES={asis:'Taller AS IS',tobe:'Taller TO BE',rev:'Revisión y coordinación',val:'Validación funcional',otra:'Otra reunión'};
const SESK={pend:{l:'Pendiente',c:'var(--late)'},venc:{l:'Vencida',c:'var(--danger)'},ok:{l:'Completada a tiempo',c:'var(--e4-bar)'},tarde:{l:'Completada fuera de plazo',c:'var(--e3-bar)'}};
const ROLES=['Líder de Procesos','PM','Consultor','Solo lectura'];
const USERS0=[
  {id:'jenny.perez',nombre:'Jenny Pérez',rol:'Líder de Procesos',eq:0},
  {id:'ivan.montano',nombre:'Ivan Montaño',rol:'PM',eq:0},
  {id:'karen.rueda',nombre:'Karen Rueda',rol:'Consultor',eq:1},
  {id:'efrain.mamani',nombre:'Efrain Mamani',rol:'Consultor',eq:1},
  {id:'vanessa.saavedra',nombre:'Vanessa Saavedra',rol:'Consultor',eq:2},
  {id:'senta.valdivia',nombre:'Senta Valdivia',rol:'Consultor',eq:2},
  {id:'alan.yujra',nombre:'Alan Yujra',rol:'Consultor',eq:3},
  {id:'gael.alvis',nombre:'Gael Alvis',rol:'Consultor',eq:3,admin:true}];
// actaMin: minutos tras el fin de la sesión para tener correo + actas. revDias: días para revisar un entregable.
const CFG0={pmRevisa:false,actaMin:90,revDias:2,actasDesde:'2026-11-04',horaDef:'18:00'};
const KEY='omega_seg_v4';
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ---------- Utilidades ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const HOY=iso(new Date());
const dt=s=>new Date(s+'T12:00:00');
const addD=(s,n)=>{const x=dt(s);x.setDate(x.getDate()+n);return iso(x)};
const fmt=s=>{if(!s)return '—';const x=dt(s);return x.getDate()+' '+MES[x.getMonth()]};
const dmy=s=>{if(!s)return '';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const dias=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const ini=n=>String(n||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=a=>a.length?Math.round(a.reduce((n,x)=>n+x,0)/a.length):0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mx=(a,b)=>a>b?a:b;
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtTs=ts=>fmt(iso(new Date(ts)))+' '+hhmm(ts);
const durTxt=ms=>{const m=Math.max(0,Math.round(ms/60000));if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;if(h<48)return h+' h'+(r?' '+r+' min':'');const d=Math.floor(h/24);return d+' d'+(h%24?' '+h%24+' h':'')};
const plural=(n,s,p)=>n+' '+(n===1?s:(p||s+'s'));

/* ---------- Datos ---------- */
// Procesos del maestro + fechas del cronograma. Todo arranca en "Sin iniciar": no hay avances inventados.
function seed(){
  const E={},S={};
  const P=window.SEED_PROCESOS.map(p=>{
    ENTS.forEach(t=>E[p.id+':'+t.k]={e:0,link:'',ver:0,fc:'',fc1:'',por:'',obs:''});
    S[p.id]=(p.ses||[]).map((s,i)=>({id:p.id+'-'+i,t:s.t,f:s.f,h:'',correo:false,actaI:false,actaP:false,link:'',done:0}));
    const {ses,...r}=p;return r});
  return {users:USERS0.map(u=>({...u})),P,SP:window.SEED_SPRINTS,E,ses:S,desv:[],rel:[],log:[],cfg:{...CFG0}};
}
function norm(s){s.cfg={...CFG0,...(s.cfg||{})};s.rel=s.rel||[];s.desv=s.desv||[];s.log=s.log||[];s.ses=s.ses||{};s.users.forEach(u=>{if(u.admin===undefined){const z=USERS0.find(y=>y.id===u.id);u.admin=!!(z&&z.admin)}});return s}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.E&&s.P&&s.users)return norm(s)}catch(e){}return seed()}
// MODE 'demo': datos en el navegador (localStorage). MODE 'sp': datos en SharePoint vía conexion.js.
let MODE='demo';
function persist(){if(MODE==='sp'){if(window.OMEGA_SP)window.OMEGA_SP.schedule(D)}else{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}}
let D=null;
let curSp=1;
const UI={as:'',rol:'',q:'',feq:'all',fsp:'all',fst:'all',fcr:'all',fmo:'all',fdep:'all',teq:'all',tsp:'1',tini:'ini',meq:'all',msp:'all',
  exp:{1:true},drawer:null,edit:null,form:null,sesF:null,sesEd:null,dvF:null,relF:null,mrel:{a:'',b:'',nota:''},misF:'activos',revEq:'all',rvT:{},
  inv:{nombre:'',id:'',rol:'Consultor',eq:'1'},ren:null,toast:'',confirmReset:false,anOpen:false,sync:{k:'ok',msg:''},fold:{},up:null};
function start(data,asId){D=norm(data);curSp=(D.SP.find(s=>s.ini<=HOY&&HOY<=s.fin)||D.SP[0]).n;UI.tsp=String(curSp);setAs(asId);render()}

/* ---------- Derivados ---------- */
const user=id=>D.users.find(u=>u.id===id);
const uName=id=>{const u=user(id);return u?u.nombre:(id||'—')};
const first=id=>uName(id).split(' ')[0];
const lider=()=>D.users.find(u=>u.rol==='Líder de Procesos')||{id:'',nombre:'Líder de Procesos'};
const team=n=>D.users.filter(u=>u.rol==='Consultor'&&u.eq==n);
const teamName=n=>{const t=team(n);return t.length?t.map(u=>u.nombre.split(' ')[0]).join(' y '):'sin consultores'};
const proc=id=>D.P.find(p=>p.id==id);
const E=(pid,k)=>D.E[pid+':'+k];
function setAs(id){const u=user(id)||(MODE==='demo'&&(user('jenny.perez')||D.users[0]));if(!u)return;UI.as=u.id;UI.rol=u.rol;if(MODE==='demo')try{localStorage.setItem(KEY+'_as',u.id)}catch(e){}}
function startDemo(){MODE='demo';let as=null;try{as=localStorage.getItem(KEY+'_as')}catch(e){}start(load(),as)}
const meU=()=>user(UI.as)||{};
const isLider=()=>UI.rol==='Líder de Procesos';
const canWork=p=>isLider()||(UI.rol==='Consultor'&&meU().eq==p.equipo);
const canReview=()=>isLider()||(UI.rol==='PM'&&D.cfg.pmRevisa);
const canRel=()=>isLider()||UI.rol==='Consultor';
// Administrador (soporte de la plataforma): puede revertir cargas, relaciones, desvíos y sesiones. La Líder también.
const isAdmin=()=>isLider()||!!meU().admin;
const relBtns=r=>`${isAdmin()&&r.est!=='Confirmado'?`<button class="btn sm" data-a="relOk" data-id="${r.id}">Confirmar</button>`:''}${isAdmin()&&r.est==='Confirmado'?`<button class="btn sm ghost" data-a="relUn" data-id="${r.id}">↶ Volver a por confirmar</button>`:''}${isAdmin()||r.autor===UI.as?`<button class="btn sm ghost" data-a="relDel" data-id="${r.id}" style="color:var(--danger)">Quitar</button>`:''}`;

// Avance programado (propuesta): lineal por días dentro de cada fase del cronograma.
function lin(a,b){if(!a||!b||HOY<a)return 0;if(HOY>=b)return 100;return Math.round((dias(a,HOY)+1)/(dias(a,b)+1)*100)}
// venc = atraso del equipo (no entregó a tiempo). vrev = entregado, pero la revisión pasó su plazo (atraso de IPPB · revisión).
function eInfo(p,t){const x=E(p.id,t.k);const f=p.fases[t.f]||{};
  const prv=x.e===2&&x.fc?mx(f.rev||f.fin||x.fc,addD(x.fc,+D.cfg.revDias||0)):'';
  return {t,x,f,exp:lin(f.ini,f.fin),prv,
    venc:!!f.fin&&f.fin<HOY&&[0,1,3].includes(x.e),
    vrev:!!prv&&prv<HOY,
    tarde:!!(x.fc1&&f.fin&&x.fc1>f.fin)}}
function quienE(p,x){return x.e===2?first(lider().id)+' · revisando':x.e===4?'—':x.e===3?'Devuelto a Equipo '+p.equipo+' · '+teamName(p.equipo):'Equipo '+p.equipo+' · '+teamName(p.equipo)}
// Actas: pendiente → vencida al pasar el plazo; al completarse queda "a tiempo" o "fuera de plazo" con su demora.
function sPlazo(s){return new Date(s.f+'T'+(s.h||D.cfg.horaDef)+':00').getTime()+(+D.cfg.actaMin||0)*60000}
function sEst(s){const c=s.correo&&s.actaI&&s.actaP;const pl=sPlazo(s);const now=Date.now();
  if(c){if(s.f<D.cfg.actasDesde)return {k:'okant',l:'Completada',c:'e4',pl};
    return s.done<=pl?{k:'ok',l:'A tiempo',c:'e4',pl}:{k:'tarde',l:'Fuera de plazo',c:'e3',pl,dem:s.done-pl}}
  if(s.f>HOY)return {k:'prog',l:'Programada',c:'e0',pl};
  if(s.f<D.cfg.actasDesde)return {k:'ant',l:'Anterior al seguimiento',c:'e0',pl};
  if(now<=pl)return {k:'pend',l:'Pendiente',c:'st-l',pl,rest:pl-now};
  return {k:'venc',l:'Vencida',c:'st-b',pl,dem:now-pl}}
function pInfo(p){
  const es=ENTS.map(t=>eInfo(p,t));
  const real=avg(es.map(e=>ST[e.x.e].p)),esp=avg(es.map(e=>e.exp));
  const venc=es.filter(e=>e.venc),vrev=es.filter(e=>e.vrev);const fin=es.every(e=>e.x.e===4);
  const cnt=ST.map((_,i)=>es.filter(e=>e.x.e===i).length);
  const fi=FASES.findIndex((_,i)=>es.some(e=>e.t.f===i&&e.x.e!==4));
  const etapa=fi<0?'Cerrado':'F'+(fi+1)+' · '+FASES[fi];
  const dv=D.desv.filter(d=>d.pid==p.id);const ult=dv[dv.length-1]||null;
  const atr=venc.length>0||vrev.length>0;
  const causa=!atr?null:venc.length?(ult?(ult.dep==='Alicorp'?'alicorp':'ippb_eq'):'sin'):'ippb_rev';
  const motivo=!atr?'':causa==='ippb_rev'?'Revisión pendiente':causa==='sin'?'Sin justificar':ult.motivo;
  const crono=fin?{k:'fin',l:'Finalizado',c:'e4'}:atr?{k:'atr',l:'Atrasado',c:'st-b'}:HOY<p.ini?{k:'pi',l:'Por iniciar',c:'e0'}:{k:'plazo',l:'En plazo',c:'ok'};
  const q=[];if(cnt[2])q.push(first(lider().id)+' · '+cnt[2]+' por revisar');if(cnt[3])q.push('Equipo '+p.equipo+' · '+cnt[3]+' por corregir');
  const quien=q.length?q.join(' / '):fin?'—':'Equipo '+p.equipo;
  const ses=(D.ses[p.id]||[]).map(s=>({s,st:sEst(s)}));
  const sesP=ses.filter(o=>o.st.k==='pend'||o.st.k==='venc');
  return {es,real,esp,desv:real-esp,venc,vrev,fin,cnt,etapa,crono,quien,dv,ult,ses,sesP,causa,motivo,sinJust:causa==='sin'};
}
function navs(){
  const r=UI.rol;
  if(r==='Líder de Procesos')return [['tablero','Tablero','◫'],['procesos','Procesos','▦'],['revision','Revisión','✓'],['cronograma','Cronograma','▤'],['mapa','Mapa','⇄'],['equipo','Equipo','⚇']];
  if(r==='PM')return [['tablero','Tablero','◫'],['procesos','Procesos','▦'],['revision','Revisión','✓'],['cronograma','Cronograma','▤'],['mapa','Mapa','⇄']];
  if(r==='Consultor')return [['mis','Mis procesos','☰'],['procesos','Procesos','▦'],['cronograma','Cronograma','▤'],['mapa','Mapa','⇄'],['tablero','Tablero','◫']].concat(meU().admin?[['equipo','Equipo','⚇']]:[]);
  return [['tablero','Tablero','◫'],['procesos','Procesos','▦'],['cronograma','Cronograma','▤'],['mapa','Mapa','⇄']];
}
const TITLES={tablero:['Tablero general','Programado vs. real, atrasos y actas'],procesos:['Procesos','Etapa, entregables y avance programado vs. real'],revision:['Bandeja de revisión','Entregables cargados que esperan revisión'],cronograma:['Cronograma','Fases planificadas por proceso'],mapa:['Mapa de procesos','Qué proceso antecede o sucede a cuál'],mis:['Mis procesos','Los procesos de tu equipo'],equipo:['Equipo y accesos','Usuarios, roles, plazos y asignación de procesos']};
function curView(){const ok=navs().map(n=>n[0]);const h=(location.hash||'').slice(1);return ok.includes(h)?h:ok[0]}

/* ---------- Componentes ---------- */
const chip=(l,c)=>`<span class="chip ${c}">${esc(l)}</span>`;
const chipE=e=>chip(ST[e].l,ST[e].c);
const dual=(real,esp)=>`<div class="bar" title="Real ${real}% · programado ${esp}%"><i style="width:${real}%;background:${real<esp?'var(--e3-bar)':'var(--accent)'}"></i><b style="left:calc(${esp}% - 1px)"></b></div>`;
const dtxt=d=>d>=0?`<span class="pos">+${d} pts</span>`:`<span class="neg">${d} pts</span>`;
const legend=()=>`<div class="legend">${ST.map(s=>`<span><i style="background:var(--${s.c}-bar)"></i>${s.l}</span>`).join('')}<span><i style="background:transparent;box-shadow:inset 0 0 0 2px var(--danger)"></i>Vencido (equipo)</span><span><i style="background:transparent;box-shadow:inset 0 0 0 2px var(--late)"></i>Revisión vencida (IPPB)</span></div>`;
function cellE(p,e){return `<button class="cell ${ST[e.x.e].c}${e.venc?' venc':''}${e.vrev?' vrev':''}" data-a="open" data-pid="${p.id}" data-k="${e.t.k}" title="${esc(e.t.l+' · '+ST[e.x.e].l+(e.venc?' · vencido el '+fmt(e.f.fin):'')+(e.vrev?' · revisión vencida el '+fmt(e.prv):'')+(e.x.link?' · archivo cargado':''))}">${e.t.s}${e.x.link?' ↗':''}</button>`}
const causaChip=x=>x.causa?`<span class="chip" style="background:var(--sunken);color:var(--text)"><i style="width:8px;height:8px;border-radius:2px;display:inline-block;background:${CAUSAS[x.causa].c}"></i>${esc(CAUSAS[x.causa].l)}</span>`:'';
// Barras verticales agrupadas (0–100 %).
function vbars(groups,series){
  const grid=[0,25,50,75,100].map(v=>`<div class="vg" style="bottom:${v}%"><span>${v}%</span></div>`).join('');
  const gs=groups.map(g=>`<div class="vgrp${g.dim?' dim':''}">${g.vals.map((v,i)=>`<div class="vbar" style="height:${Math.max(v,.6)}%;background:${series[i].c}" title="${esc(g.l+' · '+series[i].l+': '+v+'%')}"><span>${v}%</span></div>`).join('')}</div>`).join('');
  return `<div class="vplot" role="img" aria-label="${esc(groups.map(g=>g.l+': '+g.vals.map((v,i)=>series[i].l+' '+v+'%').join(', ')).join('; '))}"><div class="vin">${grid}<div class="vgrps">${gs}</div></div></div>
  <div class="vlbls">${groups.map(g=>`<div>${esc(g.l)}${g.sub?`<small>${esc(g.sub)}</small>`:''}</div>`).join('')}</div>
  <div class="legend" style="margin-top:10px">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.l}</span>`).join('')}</div>`}
// Barras horizontales (conteos). Si la fila tiene acción, es clicable.
function hbars(rows){const m=Math.max(1,...rows.map(r=>r.v));
  return `<div class="rows" style="gap:2px">${rows.map(r=>{const inner=`<div class="hb"><div class="lbl">${esc(r.l)}${r.sub?`<small>${esc(r.sub)}</small>`:''}</div><div class="track"><i style="width:${r.v/m*100}%;background:${r.c}" title="${esc(r.l+': '+r.v)}"></i></div><b class="num" style="text-align:right">${r.v}</b></div>`;
    return r.a?`<button class="clkrow" data-a="${r.a}" data-v="${esc(r.d)}" title="Ver estos procesos">${inner}</button>`:`<div style="padding:4px 6px">${inner}</div>`}).join('')}</div>`}
function motivoRows(atr){
  return MOTIVOS.map(x=>({l:x.m,dep:x.d,v:atr.filter(y=>(y.causa==='alicorp'||y.causa==='ippb_eq')&&y.ult.motivo===x.m).length,c:x.d==='Alicorp'?CAUSAS.alicorp.c:CAUSAS.ippb_eq.c,a:'goMot',d:x.m}))
    .concat([{l:'Revisión pendiente',dep:'IPPB · revisión',sub:'entregado, falta revisar',v:atr.filter(y=>y.causa==='ippb_rev').length,c:CAUSAS.ippb_rev.c,a:'goDep',d:'ippb_rev'},
      {l:'Sin justificar',dep:'—',v:atr.filter(y=>y.causa==='sin').length,c:CAUSAS.sin.c,a:'goMot',d:'sin'}])}
function actasOf(xs){return xs.flatMap(x=>x.ses.map(o=>({p:x.p,...o})))}

/* ---------- Tablero ---------- */
function tabData(){return D.P.filter(p=>(UI.teq==='all'||p.equipo==UI.teq)&&(UI.tsp==='all'||p.sprint==UI.tsp)).map(p=>({p,...pInfo(p)}))}
function vTablero(){
  const allF=tabData();
  const base=UI.tini==='ini'?allF.filter(x=>x.p.ini<=HOY):allF;
  const es=allF.flatMap(x=>x.es);
  const cnt=ST.map((_,i)=>es.filter(e=>e.x.e===i).length);
  const real=avg(base.map(x=>x.real)),esp=avg(base.map(x=>x.esp));
  const atr=allF.filter(x=>x.crono.k==='atr');
  const nAli=atr.filter(x=>x.causa==='alicorp').length;
  const vrevN=allF.reduce((s,x)=>s+x.vrev.length,0);
  const act=actasOf(allF);const ac=k=>act.filter(a=>a.st.k===k).length;
  const kpis=[
    ['Avance real / programado',`${real}%<small> / ${esp}%</small>`,dtxt(real-esp)+' frente al cronograma'],
    ['Procesos atrasados',atr.length,`de ${allF.filter(x=>x.p.ini<=HOY).length} iniciados · ${atr.filter(x=>x.sinJust).length} sin justificar`],
    ['Atraso por Alicorp',`${nAli}<small> / ${atr.length}</small>`,'atrasos que dependen del cliente'],
    ['En revisión',cnt[2],`con ${esc(first(lider().id))} · ${plural(vrevN,'vencida')}`],
    ['Observados',cnt[3],'devueltos al consultor'],
    ['Actas vencidas',ac('venc'),`${ac('pend')} pendientes · ${ac('tarde')} fuera de plazo`]];
  // Programado vs real por equipo
  const grp=(l,sub,it,dim)=>({l,sub,dim,vals:[avg(it.map(x=>x.esp)),avg(it.map(x=>x.real))]});
  const SER=[{l:'Programado',c:'var(--prog)'},{l:'Real',c:'var(--accent)'}];
  const eqs=[1,2,3].filter(n=>UI.teq==='all'||UI.teq==n);
  const gEq=eqs.map(n=>grp('Equipo '+n,teamName(n),base.filter(x=>x.p.equipo===n)));
  if(eqs.length>1)gEq.push(grp('Total',base.length+' procesos',base));
  const bySp=D.P.filter(p=>UI.teq==='all'||p.equipo==UI.teq).map(p=>({p,...pInfo(p)}));
  const gSp=D.SP.map(sp=>{const it=bySp.filter(x=>x.p.sprint===sp.n);return grp('Sprint '+sp.n,fmt(sp.ini)+' – '+fmt(sp.fin),it,UI.tsp!=='all'&&UI.tsp!=sp.n)});
  // De quién depende
  const dep=Object.entries(CAUSAS).map(([k,c])=>({l:c.l,sub:k==='alicorp'?'falta BAE, usuarios, accesos, reprogramación…':k==='ippb_eq'?'motivo atribuido al equipo':k==='ippb_rev'?'entregado, esperando revisión de '+first(lider().id):'atrasado sin motivo registrado',v:atr.filter(x=>x.causa===k).length,c:c.c,a:'goDep',d:k}));
  const porEnt=ENTS.map(t=>{const ds=es.filter(e=>e.t.k===t.k);const n=ds.length||1;
    return `<div class="row"><div class="lbl" style="width:200px;flex-shrink:0">${t.l}<small>F${t.f+1} · ${ds.filter(e=>e.x.e===4).length} de ${ds.length} finalizados</small></div><div class="stack">${ST.map((s,i)=>{const c=ds.filter(e=>e.x.e===i).length;return c?`<i style="width:${c/n*100}%;background:var(--${s.c}-bar)" title="${s.l}: ${c}"></i>`:''}).join('')}</div></div>`}).join('');
  const alertas=atr.sort((a,b)=>(b.venc.length+b.vrev.length)-(a.venc.length+a.vrev.length)).slice(0,8).map(x=>`<button class="alert" data-a="open" data-pid="${x.p.id}">${causaChip(x)}<div style="min-width:0"><div class="t">${esc(x.p.nombre)}</div><div class="m">${esc(x.p.codigo)} · S${x.p.sprint} · Equipo ${x.p.equipo} · ${esc(x.motivo)}${x.venc.length?' · '+plural(x.venc.length,'entregable vencido','entregables vencidos'):''}${x.vrev.length?' · '+plural(x.vrev.length,'revisión vencida','revisiones vencidas'):''} · real ${x.real}% / programado ${x.esp}%</div></div></button>`).join('')||'<div class="empty">Ningún proceso atrasado en este filtro.</div>';
  // Actas
  const done=ac('ok')+ac('tarde');const cumpl=done+ac('venc')?Math.round(ac('ok')/(done+ac('venc'))*100):null;
  const tardes=act.filter(a=>a.st.k==='tarde');const demProm=tardes.length?tardes.reduce((s,a)=>s+a.st.dem,0)/tardes.length:0;
  const actRows=Object.entries(SESK).map(([k,s])=>({l:s.l,v:ac(k),c:s.c}));
  const actList=act.filter(a=>a.st.k==='venc'||a.st.k==='pend').sort((a,b)=>a.st.pl-b.st.pl).slice(0,6).map(a=>`<button class="alert" data-a="open" data-pid="${a.p.id}">${chip(a.st.l,a.st.c)}<div style="min-width:0"><div class="t">${SES[a.s.t]||a.s.t} · ${esc(a.p.nombre)}</div><div class="m">${fmt(a.s.f)} · Equipo ${a.p.equipo} · ${a.st.k==='venc'?'vencida hace '+durTxt(a.st.dem):'quedan '+durTxt(a.st.rest)} · falta: ${[!a.s.correo&&'correo',!a.s.actaI&&'acta interna',!a.s.actaP&&'acta PMO-100'].filter(Boolean).join(', ')}</div></div></button>`).join('');
  const feed=D.log.filter(r=>{const p=proc(r.pid);return p&&(UI.teq==='all'||p.equipo==UI.teq)}).slice().sort((a,b)=>b.ts-a.ts).slice(0,7).map(r=>{const p=proc(r.pid);
    return `<div class="it"><span class="av sm">${ini(uName(r.autor))}</span><div style="min-width:0"><b style="font-size:13px">${esc(uName(r.autor))}</b> <span class="muted" style="font-size:12px">· ${r.ts?fmtTs(r.ts):fmt(r.fecha)}</span><p>${esc(r.k?ENT[r.k].s+' · ':'')}${esc(p?p.nombre:'')}: ${esc(r.t)}</p></div></div>`}).join('');
  const o=(v,cur,l)=>`<option value="${esc(v)}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`;
  return `
  <div class="filters">
    <select class="sel" id="teq" data-f="teq" aria-label="Equipo">${o('all',UI.teq,'Todos los equipos')}${[1,2,3].map(n=>o(n,UI.teq,'Equipo '+n+' · '+teamName(n))).join('')}</select>
    <select class="sel" id="tsp" data-f="tsp" aria-label="Sprint">${o('all',UI.tsp,'Todos los sprints')}${D.SP.map(s=>o(s.n,UI.tsp,'Sprint '+s.n+' · '+fmt(s.ini)+' – '+fmt(s.fin))).join('')}</select>
    <div class="seg" role="group" aria-label="Procesos que cuentan en el avance"><button data-a="tini" data-v="ini" aria-pressed="${UI.tini==='ini'}">Solo iniciados</button><button data-a="tini" data-v="all" aria-pressed="${UI.tini==='all'}">Todos</button></div>
    <span class="muted" style="font-size:12.5px">${allF.length} procesos en el filtro</span>
    <button class="btn pri" data-a="export" style="margin-left:auto">⤓ Exportar reporte (Excel)</button>
  </div>
  <div class="grid g6">${kpis.map(k=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid g2e">
    <div class="card"><h2>Programado vs. real por equipo <small>${UI.tini==='ini'?'procesos ya iniciados':'todos los procesos del filtro'}</small></h2>${gEq.length?vbars(gEq,SER):'<div class="empty">Sin procesos.</div>'}</div>
    <div class="card"><h2>Programado vs. real por sprint <small>${UI.teq==='all'?'todos los equipos':'Equipo '+UI.teq}</small></h2>${vbars(gSp,SER)}</div>
  </div>
  <div class="grid g2e">
    <div class="card"><h2>¿De quién depende el atraso? <small>${plural(atr.length,'proceso atrasado','procesos atrasados')}</small></h2>${atr.length?hbars(dep):'<div class="empty">No hay procesos atrasados.</div>'}<p class="muted" style="font-size:12px;margin:10px 0 0">Si el entregable ya se cargó a tiempo y falta revisarlo, el atraso es de IPPB · revisión, no del consultor. Haz clic en una barra para ver esos procesos.</p></div>
    <div class="card"><h2>Atrasos por motivo</h2>${atr.length?hbars(motivoRows(atr).map(r=>({...r,sub:r.sub||('depende de '+r.dep)}))):'<div class="empty">No hay procesos atrasados.</div>'}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Procesos atrasados</h2><div class="rows" style="gap:8px">${alertas}</div></div>
    <div class="card"><h2>Actas de sesiones <small>plazo ${durTxt(D.cfg.actaMin*60000)} tras la sesión</small></h2>${hbars(actRows)}
      <p style="font-size:13px;margin:10px 0 12px">${cumpl==null?'<span class="muted">Aún no hay actas que medir en este filtro.</span>':`<b>${cumpl}%</b> de las actas se entregaron a tiempo.${tardes.length?` Las que llegaron tarde demoraron en promedio <b>${durTxt(demProm)}</b> de más.`:''}`}</p>
      <div class="rows" style="gap:8px">${actList||'<div class="empty" style="padding:10px">No hay actas pendientes ni vencidas.</div>'}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Entregables por estado</h2><div class="rows">${porEnt}</div><div style="margin-top:14px">${legend()}</div></div>
    <div class="card"><h2>Actividad reciente</h2><div class="feed">${feed||'<div class="empty">Aún no hay movimientos. Cuando un consultor cargue un entregable o Jenny lo revise, aparecerá aquí.</div>'}</div></div>
  </div>`;
}

/* ---------- Procesos ---------- */
function filtrar(){
  const q=UI.q.trim().toLowerCase();
  return D.P.slice().sort((a,b)=>a.ini.localeCompare(b.ini)||a.equipo-b.equipo).map(p=>({p,...pInfo(p)})).filter(x=>(UI.feq==='all'||x.p.equipo==UI.feq)&&(UI.fsp==='all'||x.p.sprint==UI.fsp)&&(UI.fst==='all'||x.cnt[+UI.fst]>0)&&(UI.fcr==='all'||x.crono.k===UI.fcr)
    &&(UI.fmo==='all'||(UI.fmo==='sin'?x.causa==='sin':(x.causa==='alicorp'||x.causa==='ippb_eq')&&x.ult.motivo===UI.fmo))
    &&(UI.fdep==='all'||x.causa===UI.fdep)
    &&(!q||[x.p.nombre,x.p.codigo,x.p.macro,x.p.po,x.p.ku,x.p.n4,x.p.n3,x.p.area].join(' ').toLowerCase().includes(q)));
}
function filtrosHTML(){
  const o=(v,cur,l)=>`<option value="${esc(v)}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`;
  const any=UI.q||UI.feq!=='all'||UI.fsp!=='all'||UI.fst!=='all'||UI.fcr!=='all'||UI.fmo!=='all'||UI.fdep!=='all';
  return `<div class="filters">
    <input class="inp" id="q" data-f="q" placeholder="Buscar proceso, código N4, PO o KU" value="${esc(UI.q)}" style="flex:1;min-width:180px;max-width:300px">
    <select class="sel" id="feq" data-f="feq" aria-label="Equipo">${o('all',UI.feq,'Todos los equipos')}${[1,2,3].map(n=>o(n,UI.feq,'Equipo '+n+' · '+teamName(n))).join('')}</select>
    <select class="sel" id="fsp" data-f="fsp" aria-label="Sprint">${o('all',UI.fsp,'Todos los sprints')}${D.SP.map(s=>o(s.n,UI.fsp,'Sprint '+s.n)).join('')}</select>
    <select class="sel" id="fst" data-f="fst" aria-label="Estado de entregable">${o('all',UI.fst,'Cualquier estado')}${ST.map((s,i)=>o(i,UI.fst,'Con entregables '+s.l.toLowerCase())).join('')}</select>
    <select class="sel" id="fcr" data-f="fcr" aria-label="Cronograma">${o('all',UI.fcr,'Todo el cronograma')}${o('atr',UI.fcr,'Atrasados')}${o('plazo',UI.fcr,'En plazo')}${o('pi',UI.fcr,'Por iniciar')}${o('fin',UI.fcr,'Finalizados')}</select>
    <select class="sel" id="fdep" data-f="fdep" aria-label="De quién depende">${o('all',UI.fdep,'Cualquier responsable')}${Object.entries(CAUSAS).map(([k,c])=>o(k,UI.fdep,'Depende de: '+c.l)).join('')}</select>
    <select class="sel" id="fmo" data-f="fmo" aria-label="Motivo de desvío">${o('all',UI.fmo,'Cualquier motivo')}${MOTIVOS.map(m=>o(m.m,UI.fmo,m.m)).join('')}${o('sin',UI.fmo,'Sin justificar')}</select>
    ${any?'<button class="btn sm ghost" data-a="clrF">Limpiar filtros</button>':''}
  </div>`;
}
function resumen(xs){
  const atr=xs.filter(x=>x.crono.k==='atr');
  const cnt=ST.map((_,i)=>xs.reduce((s,x)=>s+x.cnt[i],0));
  let m='';if(atr.length){const c={};atr.forEach(x=>{const k=CAUSAS[x.causa].l;c[k]=(c[k]||0)+1});m=' ('+Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>v+' '+k).join(', ')+')'}
  return `<div class="summary"><b>${xs.length} procesos</b> · <b class="${atr.length?'neg':''}">${atr.length} con retraso</b>${esc(m)} · entregables: ${cnt[3]} observados, ${cnt[2]} en revisión, ${cnt[4]} finalizados</div>`;
}
function vProcesos(){
  const xs=filtrar();
  const rows=xs.map(x=>{const p=x.p;
    return `<tr class="clk"><td><button data-a="open" data-pid="${p.id}" class="pname">${esc(p.nombre)}<span class="mono">${esc(p.codigo)}</span></button></td>
    <td class="num">S${p.sprint}</td><td style="white-space:nowrap">Eq. ${p.equipo}<div class="muted" style="font-size:11.5px">${esc(teamName(p.equipo))}</div></td>
    <td style="white-space:nowrap;font-size:12.5px">${esc(x.etapa)}</td><td style="font-size:12.5px;min-width:130px">${esc(x.quien)}</td>
    ${FASES.map((_,i)=>`<td><div class="cells">${x.es.filter(e=>e.t.f===i).map(e=>cellE(p,e)).join('')}</div></td>`).join('')}
    <td class="num">${x.esp}%</td><td class="num"><b>${x.real}%</b></td><td class="num" style="white-space:nowrap">${dtxt(x.desv)}</td>
    <td>${chip(x.crono.l,x.crono.c)}${x.crono.k==='atr'?`<div style="font-size:11.5px;margin-top:4px;white-space:nowrap" class="${x.causa==='sin'?'neg':'muted'}">${esc(CAUSAS[x.causa].l)}${x.causa!=='sin'&&x.causa!=='ippb_rev'?' · '+esc(x.motivo):''}</div>`:''}</td></tr>`}).join('');
  return filtrosHTML()+resumen(xs)+legend()+`<div class="tblwrap"><table><thead><tr><th>Proceso · código N4</th><th>Sprint</th><th>Equipo</th><th>Etapa actual</th><th>Con quién</th>${FCORTA.map((f,i)=>`<th>F${i+1} ${f}</th>`).join('')}<th>Programado</th><th>Real</th><th>Desvío</th><th>Cronograma</th></tr></thead><tbody>${rows||`<tr><td colspan="13" class="empty">Ningún proceso coincide con los filtros.</td></tr>`}</tbody></table></div><p class="muted" style="margin:0;font-size:12px">Haz clic en un entregable para ver su archivo, su estado y su historial. ↗ = archivo cargado.</p>`;
}

/* ---------- Bandeja de revisión ---------- */
function vRevision(){
  const all=D.P.flatMap(p=>ENTS.map(t=>({p,...eInfo(p,t)}))).filter(o=>UI.revEq==='all'||o.p.equipo==UI.revEq);
  const pend=all.filter(o=>o.x.e===2).sort((a,b)=>a.prv.localeCompare(b.prv));
  const obs=all.filter(o=>o.x.e===3);
  const nv=pend.filter(o=>o.vrev).length;
  const rv=canReview();
  const card=o=>{const key=o.p.id+':'+o.t.k;
    return `<div class="card rvcard"><div class="hd"><div style="flex:1;min-width:200px"><span class="mono muted">${esc(o.p.codigo)} · F${o.t.f+1} ${FASES[o.t.f]}</span><h3 style="font-size:15px;margin-top:3px">${esc(o.t.l)}</h3><div class="muted" style="font-size:12.5px">${esc(o.p.nombre)} · Equipo ${o.p.equipo} · ${esc(teamName(o.p.equipo))}</div></div>${o.vrev?chip('Revisión vencida','st-l'):chipE(2)}</div>
    <div class="muted" style="font-size:12.5px">Versión ${o.x.ver} · cargado por ${esc(uName(o.x.por))} el ${fmt(o.x.fc)}${o.tarde?' (fuera de plazo)':' (a tiempo)'} · revisar hasta <b style="color:${o.vrev?'var(--late)':'inherit'}">${fmt(o.prv)}</b>${o.x.link?` · <a href="${esc(o.x.link)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">Abrir archivo ↗</a>`:''}</div>
    ${rv?`<textarea class="inp fw big" id="rv-${o.p.id}-${o.t.k}" data-f="rv" data-key="${key}" placeholder="Observaciones para el consultor (obligatorio si lo observas). Puedes escribir todo lo que necesites.">${esc(UI.rvT[key]||'')}</textarea>
    <div class="row" style="justify-content:flex-end;flex-wrap:wrap"><button class="btn sm" data-a="open" data-pid="${o.p.id}" data-k="${o.t.k}">Ver proceso</button><button class="btn sm warn" data-a="rObs" data-key="${key}">Observar y devolver</button><button class="btn sm ok" data-a="rFin" data-key="${key}">Finalizar</button></div>`:`<p class="note" style="margin:0">Solo la Líder de Procesos cambia este estado.</p>`}</div>`};
  return `<div class="filters"><select class="sel" id="revEq" data-f="revEq" aria-label="Equipo"><option value="all">Todos los equipos</option>${[1,2,3].map(n=>`<option value="${n}" ${UI.revEq==n?'selected':''}>Equipo ${n} · ${esc(teamName(n))}</option>`).join('')}</select><span class="muted" style="font-size:12.5px">${pend.length} por revisar${nv?` · <b style="color:var(--late)">${nv} con la revisión vencida</b>`:''} · ${obs.length} observados con los consultores</span></div>
  <div class="pgrid">${pend.map(card).join('')||'<div class="card empty" style="grid-column:1/-1">No hay entregables esperando revisión. Cuando un consultor cargue un entregable, aparecerá aquí.</div>'}</div>
  ${obs.length?`<div class="card"><h2>Observados <small>ya están en la bandeja del equipo para corregir</small></h2><div class="rows" style="gap:8px">${obs.map(o=>`<button class="alert" data-a="open" data-pid="${o.p.id}" data-k="${o.t.k}">${chipE(3)}<div style="min-width:0"><div class="t">${esc(o.t.l)} · ${esc(o.p.nombre)}</div><div class="m">Lo tiene: Equipo ${o.p.equipo} · ${esc(teamName(o.p.equipo))} · ${esc(o.x.obs.length>140?o.x.obs.slice(0,140)+'…':o.x.obs)}</div></div></button>`).join('')}</div></div>`:''}`;
}

/* ---------- Cronograma ---------- */
function vCronograma(){
  const G0=D.P.reduce((m,p)=>p.ini<m?p.ini:m,'9999'),G1=addD(D.P.reduce((m,p)=>p.fin>m?p.fin:m,''),1);const tot=dias(G0,G1);
  const pos=s=>Math.max(0,Math.min(100,dias(G0,s)/tot*100));
  const sem=[];for(let d=G0;d<G1;d=addD(d,14))sem.push(d);
  const today=HOY>=G0&&HOY<=G1?`<div class="gtoday" style="left:${pos(HOY)}%" title="Hoy"></div>`:'';
  const rows=D.SP.map(sp=>{const it=D.P.filter(p=>p.sprint===sp.n).sort((a,b)=>a.ini.localeCompare(b.ini));const inf=it.map(pInfo);const r=avg(inf.map(x=>x.real)),e=avg(inf.map(x=>x.esp));const L=pos(sp.ini),W=pos(addD(sp.fin,1))-L;const open=!!UI.exp[sp.n];
    let h=`<div class="grow"><div class="gl"><button class="caret" data-a="exp" data-n="${sp.n}" aria-expanded="${open}" aria-label="Mostrar procesos">${open?'▼':'▶'}</button><b style="display:inline">Sprint ${sp.n}</b><div class="muted" style="font-size:11.5px;padding-left:16px">${it.length} procesos · real ${r}% / programado ${e}%</div></div><div class="gtrack">${today}<div class="gbar" style="left:${L}%;width:${W}%"><i style="width:${r}%;background:var(--accent)"></i></div></div></div>`;
    if(open)h+=it.map((p,j)=>{const I=inf[j];
      const segs=p.fases.map((f,i)=>{const es=I.es.filter(x=>x.t.f===i);const done=es.every(x=>x.x.e===4);const v=es.some(x=>x.venc);const vr=es.some(x=>x.vrev);const col=done?'var(--e4-bar)':v?'var(--danger)':vr?'var(--late)':f.ini<=HOY?'var(--accent)':'var(--e0-bar)';const l=pos(f.ini),w=Math.max(.6,pos(addD(f.fin,1))-l);
        return `<div class="gseg" style="left:${l}%;width:${w}%;background:${col};opacity:${i%2?.8:1}" title="F${i+1} ${FASES[i]} · ${fmt(f.ini)} – ${fmt(f.fin)}"></div>`}).join('');
      return `<div class="grow gsub"><div class="gl"><button data-a="open" data-pid="${p.id}" style="border:0;background:transparent;padding:0;text-align:left;font-size:12.5px">${esc(p.nombre)}</button><div class="muted mono">Eq. ${p.equipo} · ${I.real}% / ${I.esp}%</div></div><div class="gtrack">${today}${segs}</div></div>`}).join('');
    return h}).join('');
  return `<div class="card" style="overflow-x:auto"><div class="gantt"><div class="gh"><div></div><div class="gscale">${sem.map(d=>`<span style="left:${pos(d)}%">${fmt(d)}</span>`).join('')}</div></div>${rows}</div></div>
  <div class="legend"><span><i style="background:var(--e0-bar)"></i>Fase por iniciar</span><span><i style="background:var(--accent)"></i>Fase en curso</span><span><i style="background:var(--e4-bar)"></i>Fase finalizada</span><span><i style="background:var(--danger)"></i>Entregables vencidos (equipo)</span><span><i style="background:var(--late)"></i>Revisión vencida (IPPB)</span><span><i style="background:var(--danger);width:2px"></i>Hoy</span></div>
  <p class="muted" style="margin:0;font-size:12px">Cada proceso muestra sus 4 fases según 03_Omega_Cronograma: AS IS → TO BE y BPMN → Documentación funcional → Validación y cierre.</p>`;
}

/* ---------- Mapa de procesos ---------- */
function procOpts(cur,excl){
  return D.SP.map(sp=>`<optgroup label="Sprint ${sp.n}">${D.P.filter(p=>p.sprint===sp.n&&p.id!=excl).map(p=>`<option value="${p.id}" ${String(cur)===String(p.id)?'selected':''}>${esc(p.codigo+' · '+p.nombre)}</option>`).join('')}</optgroup>`).join('')}
function addRel(a,b,nota){a=+a;b=+b;
  if(!a||!b){toast('Elige los dos procesos');return false}
  if(a===b){toast('Un proceso no puede antecederse a sí mismo');return false}
  if(D.rel.some(r=>r.a===a&&r.b===b)){toast('Esa relación ya está registrada');return false}
  if(D.rel.some(r=>r.a===b&&r.b===a)){toast('Ya existe la relación al revés; quítala primero si está mal');return false}
  D.rel.push({id:uid(),a,b,est:'Por confirmar',nota:String(nota||'').trim(),autor:UI.as,fecha:HOY});
  D.log.push({id:uid(),pid:b,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Relación: '+proc(a).nombre+' → '+proc(b).nombre});
  persist();toast('Relación registrada. Queda «por confirmar» con negocio.');return true}
function relItem(r,other,lado){const o=proc(other);if(!o)return '';
  return `<div class="rel"><button class="relp" data-a="open" data-pid="${o.id}">${lado} ${esc(o.nombre)}<small>${esc(o.codigo)} · S${o.sprint} · Eq. ${o.equipo}${r.nota?' · '+esc(r.nota):''} · ${esc(first(r.autor))} ${fmt(r.fecha)}</small></button>${chip(r.est,r.est==='Confirmado'?'e4':'e1')}
  ${relBtns(r)}</div>`}
function vMapa(){
  const pass=p=>(UI.meq==='all'||p.equipo==UI.meq)&&(UI.msp==='all'||p.sprint==UI.msp);
  const R=D.rel.filter(r=>{const a=proc(r.a),b=proc(r.b);return a&&b&&(pass(a)||pass(b))});
  const ids=[...new Set(R.flatMap(r=>[r.a,r.b]))];
  const lvl={};const L=(id,st)=>{if(lvl[id]!=null)return lvl[id];if(st.has(id))return 0;st.add(id);const ps=R.filter(r=>r.b===id).map(r=>r.a);const v=ps.length?Math.max(...ps.map(x=>L(x,st)+1)):0;st.delete(id);lvl[id]=v;return v};
  ids.forEach(id=>L(id,new Set()));
  const cols={};ids.forEach(id=>{(cols[lvl[id]]=cols[lvl[id]]||[]).push(proc(id))});
  const W=236,H=62,GX=80,GY=16,pos={};let maxR=0;
  Object.keys(cols).forEach(c=>{cols[c].sort((a,b)=>a.sprint-b.sprint||a.ini.localeCompare(b.ini)).forEach((p,i)=>{pos[p.id]={x:12+c*(W+GX),y:12+i*(H+GY)};maxR=Math.max(maxR,i+1)})});
  const nC=Object.keys(cols).length;const SW=Math.max(300,12+nC*(W+GX)-GX+12),SH=12+maxR*(H+GY)-GY+12;
  const cut=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
  const edges=R.map(r=>{const a=pos[r.a],b=pos[r.b];const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2;const ok=r.est==='Confirmado';
    return `<path d="M${x1} ${y1} C${x1+50} ${y1} ${x2-50} ${y2} ${x2-2} ${y2}" fill="none" stroke="${ok?'var(--navy)':'var(--accent)'}" stroke-width="2" ${ok?'':'stroke-dasharray="6 5"'} marker-end="url(#${ok?'arN':'arA'})"><title>${esc(proc(r.a).nombre+' → '+proc(r.b).nombre+' · '+r.est)}</title></path>`}).join('');
  const nodes=ids.map(id=>{const p=proc(id),q=pos[id],I=pInfo(p);const sc=I.crono.k==='atr'?'var(--danger)':I.crono.k==='fin'?'var(--pos)':'var(--line)';
    return `<g class="mnode" data-a="open" data-pid="${id}" transform="translate(${q.x} ${q.y})"><rect width="${W}" height="${H}" rx="12" fill="var(--surface)" stroke="${sc}" stroke-width="${I.crono.k==='atr'?2:1.5}"/><text x="12" y="18" font-family="var(--f-mono)" font-size="10.5" fill="var(--muted)">${esc(p.codigo)} · S${p.sprint} · Eq.${p.equipo}</text><text x="12" y="36" font-size="12.5" font-weight="600" fill="var(--text)">${esc(cut(p.nombre,33))}</text><text x="12" y="52" font-size="11" fill="var(--muted)">${esc(cut(p.nombre.length>33?p.nombre.slice(32):'',36))}</text><title>${esc(p.nombre)}</title></g>`}).join('');
  const o=(v,cur,l)=>`<option value="${esc(v)}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`;
  const M=UI.mrel;
  const list=R.slice().reverse().map(r=>{const a=proc(r.a),b=proc(r.b);return `<tr><td><button class="pname" data-a="open" data-pid="${a.id}">${esc(a.nombre)}<span class="mono">${esc(a.codigo)}</span></button></td><td aria-label="antecede a">→</td><td><button class="pname" data-a="open" data-pid="${b.id}">${esc(b.nombre)}<span class="mono">${esc(b.codigo)}</span></button></td><td style="font-size:12.5px">${esc(r.nota||'—')}<div class="muted" style="font-size:11.5px">${esc(first(r.autor))} · ${fmt(r.fecha)}</div></td><td>${chip(r.est,r.est==='Confirmado'?'e4':'e1')}</td><td style="white-space:nowrap">${relBtns(r)}</td></tr>`}).join('');
  return `<div class="filters"><select class="sel" id="meq" data-f="meq" aria-label="Equipo">${o('all',UI.meq,'Todos los equipos')}${[1,2,3].map(n=>o(n,UI.meq,'Equipo '+n)).join('')}</select><select class="sel" id="msp" data-f="msp" aria-label="Sprint">${o('all',UI.msp,'Todos los sprints')}${D.SP.map(s=>o(s.n,UI.msp,'Sprint '+s.n)).join('')}</select><span class="muted" style="font-size:12.5px">${plural(R.length,'relación','relaciones')} · ${plural(ids.length,'proceso')}</span></div>
  ${canRel()?`<form data-form="mrel" class="card" style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0">Registrar una relación <small>sale de lo levantado en las sesiones</small></h2>
    <div class="two"><div><label class="flbl" for="mra">Proceso que va antes</label><select class="sel fw" id="mra" data-f="mrA"><option value="">Elegir…</option>${procOpts(M.a)}</select></div><div><label class="flbl" for="mrb">Proceso que va después</label><select class="sel fw" id="mrb" data-f="mrB"><option value="">Elegir…</option>${procOpts(M.b,M.a)}</select></div></div>
    <div class="row" style="flex-wrap:wrap;align-items:flex-end"><div style="flex:1;min-width:200px"><label class="flbl" for="mrn">De dónde sale</label><input class="inp fw" id="mrn" data-f="mrN" placeholder="Ej. Taller AS IS del 28 oct con el KU" value="${esc(M.nota)}"></div><button class="btn pri" type="submit">Agregar relación</button></div></form>`:''}
  ${R.length?`<div class="mapwrap"><svg width="${SW}" height="${SH}" viewBox="0 0 ${SW} ${SH}" role="img" aria-label="Mapa de relaciones entre procesos"><defs><marker id="arN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--navy)"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>${edges}${nodes}</svg></div>
  <div class="legend"><span><i style="background:var(--navy);height:2px;width:18px"></i>Confirmada por negocio</span><span><i style="background:repeating-linear-gradient(90deg,var(--accent) 0 5px,transparent 5px 9px);height:2px;width:18px"></i>Por confirmar</span><span><i style="background:transparent;box-shadow:inset 0 0 0 2px var(--danger)"></i>Proceso atrasado</span><span>De izquierda a derecha: lo que va antes → lo que va después. Haz clic en un proceso para abrir su ficha.</span></div>
  <div class="tblwrap"><table><thead><tr><th>Antecesor</th><th></th><th>Sucesor</th><th>Origen</th><th>Estado</th><th></th></tr></thead><tbody>${list}</tbody></table></div>`
  :`<div class="card empty">Todavía no hay relaciones${UI.meq!=='all'||UI.msp!=='all'?' en este filtro':''}. Regístralas a medida que las confirmen en las sesiones, aquí arriba o desde la ficha de cada proceso. Con eso se va armando el mapa.</div>`}`;
}

async function boot(){

  if(!window.OMEGA_SP||!window.msal){scError(new Error('No se cargó conexion.js o la librería de Microsoft (msal). Revisa tu conexión a internet.'));return}

}
async function openReal(){
  scLoading('Conectando con SharePoint…');

  const data=await OMEGA_SP.loadAll();
  if(!data){scSetup();return}

  if(!u){scNoAccess(me);return}

}
async function runSetup(){const S=UI.setup;
  const rows=S.rows.map(r=>({...r,id:r.id.trim().toLowerCase()}));
  if(rows.some(r=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.id))){S.msg='Completa un correo válido para cada persona.';S.err=true;scSetup();return}
  if(!rows.some(r=>r.id===OMEGA_SP.email())){S.msg='Tu propio correo ('+OMEGA_SP.email()+') debe estar en la lista.';S.err=true;scSetup();return}
  if(!S.file){S.msg='Elige el archivo de datos iniciales.';S.err=true;scSetup();return}
  let j;try{j=JSON.parse(await S.file.text())}catch(e){S.msg='El archivo no es un JSON válido.';S.err=true;scSetup();return}
  if(!Array.isArray(j.procesos)||!Array.isArray(j.sprints)){S.msg='El archivo no tiene «procesos» y «sprints».';S.err=true;scSetup();return}
  window.SEED_PROCESOS=j.procesos;window.SEED_SPRINTS=j.sprints;
  const d=seed();delete window.SEED_PROCESOS;
  d.users=rows.map(r=>({id:r.id,nombre:r.nombre,rol:r.rol,eq:r.eq,admin:r.id===OMEGA_SP.email()||!!r.admin}));
  S.busy=true;S.err=false;
  const prog=t=>{S.msg=t;scSetup()};
  try{await OMEGA_SP.setup(d,S.folders,prog);S.busy=false;UI.setup=null;await openReal()}
  catch(e){S.busy=false;S.msg='Error: '+errTxt(e)+' ('+(e.message||e)+')';S.err=true;scSetup()}
}

    case 'dvX':UI.dvF=null;render();break;
    case 'relAdd':UI.relF={t:'ant',o:'',n:''};render();break;
    case 'relX':UI.relF=null;render();break;
    case 'relOk':{const r=D.rel.find(x=>x.id===el.dataset.id);if(r){r.est='Confirmado';D.log.push({id:uid(),pid:r.b,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Confirmó relación: '+proc(r.a).nombre+' → '+proc(r.b).nombre});persist();toast('Relación confirmada')}break}
    case 'relDel':{const r=D.rel.find(x=>x.id===el.dataset.id);D.rel=D.rel.filter(x=>x.id!==el.dataset.id);if(r)D.log.push({id:uid(),pid:r.b,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Quitó relación: '+proc(r.a).nombre+' → '+proc(r.b).nombre});persist();toast('Relación quitada');break}
    case 'relUn':{const r=D.rel.find(x=>x.id===el.dataset.id);if(r){r.est='Por confirmar';D.log.push({id:uid(),pid:r.b,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Volvió a «por confirmar»: '+proc(r.a).nombre+' → '+proc(r.b).nombre});persist();toast('La relación vuelve a «por confirmar»')}break}
    case 'eRev':UI.cRev=el.dataset.key;render();break;
    case 'eRevN':UI.cRev=null;render();break;
    case 'eRevY':UI.cRev=null;UI.form={link:'',t:''};revertE(el.dataset.key);startEdit(el.dataset.key);render();break;
    case 'dvDel':{const d=D.desv.find(x=>x.id===el.dataset.id);if(d){D.desv=D.desv.filter(x=>x!==d);D.log.push({id:uid(),pid:d.pid,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Anuló el motivo «'+d.motivo+'» registrado por '+first(d.autor)+' el '+fmt(d.fecha)+': '+d.det});persist();toast('Motivo anulado')}break}
    case 'sesDel':{const o=findSes(el.dataset.sid);if(o){D.ses[o.pid]=D.ses[o.pid].filter(x=>x!==o.s);D.log.push({id:uid(),pid:o.pid,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Eliminó la sesión '+(SES[o.s.t]||o.s.t)+' del '+fmt(o.s.f)});UI.sesEd=null;persist();toast('Sesión eliminada')}break}
    case 'uAdm':{const u=user(el.dataset.id);u.admin=!u.admin;persist();toast(u.nombre+(u.admin?' ahora es administrador':' ya no es administrador'));break}
    case 'anTog':e.preventDefault();UI.anOpen=!UI.anOpen;render();break;
    case 'exp':UI.exp[el.dataset.n]=!UI.exp[el.dataset.n];render();break;
    case 'misF':UI.misF=el.dataset.v;render();break;
    case 'tini':UI.tini=el.dataset.v;render();break;
    case 'export':exportar();break;
    case 'login':OMEGA_SP.login();break;
    case 'logout':if(window.OMEGA_SP&&OMEGA_SP.ready())OMEGA_SP.logout();else location.reload();break;
    case 'reload':location.reload();break;
    case 'refresh':OMEGA_SP.refresh().then(()=>toast('Datos actualizados')).catch(err=>toast(errTxt(err)));break;
    case 'syncRetry':OMEGA_SP.schedule(D,0);break;
    case 'suFold':UI.setup.folders=!UI.setup.folders;scSetup();break;
    case 'suRun':runSetup();break;
    case 'foldLoad':loadFold(+el.dataset.pid);break;
    case 'foldMake':{const p=proc(el.dataset.pid);UI.fold[p.id]={k:'loading'};render();OMEGA_SP.ensureProcFolders(p,SUBS).then(()=>{D.log.push({id:uid(),pid:p.id,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Creó las carpetas del proceso en SharePoint'});persist();loadFold(p.id)}).catch(err=>{UI.fold[p.id]={k:'error',msg:errTxt(err)};render()});break}
    case 'useFile':if(UI.form){UI.form.link=el.dataset.url;render()}break;
    case 'useActa':{const o=findSes(el.dataset.key);if(o){o.s.link=el.dataset.url;D.log.push({id:uid(),pid:o.pid,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Vinculó el acta de '+(SES[o.s.t]||o.s.t)+' '+fmt(o.s.f)});persist();render()}break}
    case 'clrF':UI.q='';UI.feq=UI.fsp=UI.fst=UI.fcr=UI.fmo=UI.fdep='all';render();break;
    case 'goMot':UI.q='';UI.fst='all';UI.feq=UI.teq;UI.fsp=UI.tsp;UI.fcr='atr';UI.fdep='all';UI.fmo=el.dataset.v;location.hash='procesos';break;
    case 'goDep':UI.q='';UI.fst='all';UI.feq=UI.teq;UI.fsp=UI.tsp;UI.fcr='atr';UI.fmo='all';UI.fdep=el.dataset.v;location.hash='procesos';break;
    case 'pmRev':D.cfg.pmRevisa=!D.cfg.pmRevisa;persist();render();break;
    case 'reset':UI.confirmReset=true;render();break;
    case 'resetN':UI.confirmReset=false;render();break;
    case 'resetY':D=seed();persist();setAs(UI.as);UI.confirmReset=false;UI.drawer=null;toast('Se borraron los avances. Los procesos vuelven a como están en el maestro y el cronograma.');break;
    case 'rename':{const u=user(el.dataset.id);UI.ren={id:u.id,nombre:u.nombre};render();break}
    case 'renX':UI.ren=null;render();break;
    case 'delU':{const id=el.dataset.id;D.users=D.users.filter(x=>x.id!==id);persist();toast('Acceso quitado');break}
  }
});
document.addEventListener('input',e=>{
  const el=e.target;const f=el.dataset&&el.dataset.f;if(!f)return;
  if(f==='suMail'){UI.setup.rows[+el.dataset.i].id=el.value;return}
  if(f==='q'){UI.q=el.value;render()}
  else if(f==='fl')UI.form.link=el.value;else if(f==='ft')UI.form.t=el.value;
  else if(f==='rv')UI.rvT[el.dataset.key]=el.value;
  else if(f==='invNombre')UI.inv.nombre=el.value;else if(f==='invId')UI.inv.id=el.value;else if(f==='renN')UI.ren.nombre=el.value;
  else if(f==='dvDet')UI.dvF.det=el.value;else if(f==='sfF')UI.sesF.f=el.value;else if(f==='sfH')UI.sesF.h=el.value;
  else if(f==='relN')UI.relF.n=el.value;else if(f==='mrN')UI.mrel.nota=el.value;
});
document.addEventListener('change',e=>{
  const el=e.target;const f=el.dataset&&el.dataset.f;if(!f)return;
  if(f==='demoFile'||f==='suFile'||f==='upE'||f==='upA'){const file=el.files&&el.files[0];if(!file)return;const ext=(file.name.match(/\.[A-Za-z0-9]+$/)||[''])[0];
    if(f==='demoFile'){file.text().then(t=>{try{const j=JSON.parse(t);window.SEED_PROCESOS=j.procesos;window.SEED_SPRINTS=j.sprints;startDemo()}catch(err){toast('El archivo no es válido')}});return}
    if(f==='suFile'){UI.setup.file=file;UI.setup.msg='';scSetup();return}
    if(f==='upE'){const key=el.dataset.key;const [pid,k]=key.split(':');const p=proc(pid);const x=D.E[key];
      uploadTo(p,SUBS[ENT[k].f],file,p.codigo+'_'+TOK[k]+'_v'+(x.ver+1)+ext).then(r=>{if(r&&UI.edit===key){UI.form.link=r.web;toast('Archivo subido. Revisa y pulsa «Cargar y enviar a revisión».')}});return}
    if(f==='upA'){const o=findSes(el.dataset.sid);if(!o)return;const p=proc(o.pid);
      uploadTo(p,'Actas',file,p.codigo+'_ACTA_'+o.s.f+'_'+o.s.t+ext).then(r=>{if(r){o.s.link=r.web;D.log.push({id:uid(),pid:o.pid,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Subió el acta de '+(SES[o.s.t]||o.s.t)+' '+fmt(o.s.f)});persist();toast('Acta subida y vinculada')}});return}}
  if(f==='rol'){setAs(el.value);UI.drawer=null;UI.edit=null;history.replaceState(null,'','#'+navs()[0][0]);render()}
  else if(['feq','fsp','fst','fcr','fmo','fdep','revEq','teq','tsp','meq','msp'].includes(f)){UI[f]=el.value;render()}
  else if(f==='sfT')UI.sesF.t=el.value;else if(f==='sfF')UI.sesF.f=el.value;else if(f==='sfH')UI.sesF.h=el.value;
  else if(f==='dvMot'){UI.dvF.motivo=el.value;UI.dvF.dep=MDEP[el.value]||'IPPB';render()}else if(f==='dvDep')UI.dvF.dep=el.value;else if(f==='dvFase')UI.dvF.fase=el.value;
  else if(f==='relT')UI.relF.t=el.value;else if(f==='relO')UI.relF.o=el.value;
  else if(f==='mrA'){UI.mrel.a=el.value;if(UI.mrel.b===el.value)UI.mrel.b='';render()}else if(f==='mrB')UI.mrel.b=el.value;
  else if(f==='seF'||f==='seH'||f==='seL'){const o=findSes(el.dataset.sid);if(!o)return;const s=o.s;
    if(f==='seF'){if(!el.value)return;const old=s.f;s.f=el.value;D.log.push({id:uid(),pid:o.pid,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Reprogramó '+SES[s.t]+': '+fmt(old)+' → '+fmt(s.f)})}
    else if(f==='seH')s.h=el.value;
    else{const v=el.value.trim();if(v&&!/^https?:\/\//i.test(v)){toast('El enlace debe empezar con https://');return}s.link=v;if(v)D.log.push({id:uid(),pid:o.pid,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Subió el acta de '+SES[s.t]+' '+fmt(s.f)})}
    persist();render()}
  else if(f==='cfgActa'||f==='cfgRev'){const n=Math.max(0,parseInt(el.value,10)||0);D.cfg[f==='cfgActa'?'actaMin':'revDias']=n;persist();toast('Plazo actualizado')}
  else if(f==='cfgDesde'){if(el.value){D.cfg.actasDesde=el.value;persist();toast('Actas medidas desde el '+fmt(el.value))}}
  else if(f==='cfgHora'){if(el.value){D.cfg.horaDef=el.value;persist();toast('Hora de fin por defecto: '+el.value)}}
  else if(f==='invRol'){UI.inv.rol=el.value;render()}else if(f==='invEq')UI.inv.eq=el.value;
  else if(f==='peq'){const p=proc(el.dataset.pid);p.equipo=+el.value;persist();toast(p.nombre+' → Equipo '+p.equipo)}
  else if(f==='ueq'){const u=user(el.dataset.id);u.eq=+el.value;persist();toast(u.nombre+' → Equipo '+u.eq)}
  else if(f==='urol'){const u=user(el.dataset.id);
    if(u.rol==='Líder de Procesos'&&el.value!=='Líder de Procesos'&&D.users.filter(x=>x.rol==='Líder de Procesos').length===1){el.value=u.rol;toast('Debe quedar al menos una Líder de Procesos');return}
    u.rol=el.value;if(u.rol==='Consultor'&&!u.eq)u.eq=1;if(u.id===UI.as)UI.rol=u.rol;persist();toast(u.nombre+' ahora es '+u.rol)}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const k=e.target.dataset.form;
  if(k==='inv'){const id=UI.inv.id.trim().toLowerCase();const nombre=UI.inv.nombre.trim();
    if(!nombre||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(id)){toast('Escribe el nombre y un correo válido');return}
    if(user(id)){toast('Esa persona ya tiene acceso');return}
    D.users.push({id,nombre,rol:UI.inv.rol,eq:UI.inv.rol==='Consultor'?+UI.inv.eq:0});UI.inv.id='';UI.inv.nombre='';persist();toast('Acceso dado a '+nombre)}
  if(k==='ren'){const u=user(UI.ren.id);const n=UI.ren.nombre.trim();if(!n){toast('Escribe un nombre');return}u.nombre=n;UI.ren=null;persist();toast('Nombre actualizado')}
  if(k==='ses'){const S=UI.sesF;if(!S.f){toast('Elige la fecha');return}const p=proc(UI.drawer);(D.ses[p.id]=D.ses[p.id]||[]).push({id:p.id+'-'+uid(),t:S.t,f:S.f,h:S.h||'',correo:false,actaI:false,actaP:false,link:'',done:0});
    D.log.push({id:uid(),pid:p.id,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Agregó sesión: '+SES[S.t]+' '+fmt(S.f)+(S.h?' (fin '+S.h+')':'')});UI.sesF=null;persist();toast('Sesión agregada')}
  if(k==='desv'){const V=UI.dvF;if(!V.det.trim()){toast('Describe el motivo del desvío');return}const p=proc(UI.drawer);
    D.desv.push({id:uid(),pid:p.id,motivo:V.motivo,dep:V.dep,fase:V.fase,det:V.det.trim(),autor:UI.as,fecha:HOY});
    D.log.push({id:uid(),pid:p.id,k:null,fecha:HOY,ts:Date.now(),autor:UI.as,a:0,t:'Desvío: '+V.motivo+' (depende de '+V.dep+') · '+V.det.trim()});UI.dvF=null;persist();toast('Motivo registrado')}
  if(k==='rel'){const R=UI.relF;const p=proc(UI.drawer);const ok=R.t==='ant'?addRel(R.o,p.id,R.n):addRel(p.id,R.o,R.n);if(ok){UI.relF=null;render()}}
  if(k==='mrel'){const M=UI.mrel;if(addRel(M.a,M.b,M.nota)){UI.mrel={a:'',b:'',nota:''};render()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.drawer!=null){UI.drawer=null;UI.edit=null;render()}});
window.addEventListener('hashchange',()=>{if(D){render();window.scrollTo(0,0)}});
boot();
})();
</script>

</body>
